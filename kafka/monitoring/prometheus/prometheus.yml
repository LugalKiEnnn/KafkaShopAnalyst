# my global config
global:
  scrape_interval:     5s # Set the scrape interval to every 15 seconds.
  evaluation_interval: 5s # Evaluate rules every 15 seconds.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "alerts.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: ['localhost:9090']

    # Scrape Kafka /metrics
  - job_name: 'kafka-1'
    static_configs:
      - targets: ['kafka-1:9876']

  - job_name: 'kafka-2'
    static_configs:
      - targets: [ 'kafka-2:9876' ]

  - job_name: 'kafka-3'
    static_configs:
      - targets: [ 'kafka-3:9876' ]

  - job_name: 'copy-kafka-1'
    static_configs:
      - targets: [ 'copy-kafka-1:9876' ]

  - job_name: 'copy-kafka-2'
    static_configs:
      - targets: [ 'copy-kafka-2:9876' ]

  - job_name: 'copy-kafka-3'
    static_configs:
      - targets: [ 'copy-kafka-3:9876' ]

  - job_name: 'elasticsearch-connect'
    static_configs:
      - targets: [ 'elasticsearch-connect:9876' ]